name: Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_BASE_URL: http://13.207.17.117/api/v1/
  EXPO_PUBLIC_ENV: production
  EXPO_PUBLIC_ALLOW_INSECURE_HTTP: "1"
  EXPO_PUBLIC_QA_MODE: "true"
  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write production env for Metro bundle
        run: |
          cat > .env.production <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=http://13.207.17.117/api/v1/
          EXPO_PUBLIC_ENV=production
          EXPO_PUBLIC_ALLOW_INSECURE_HTTP=1
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit Android asset filenames
        run: node scripts/audit-android-asset-names.mjs

      - name: Audit production API endpoints
        run: node scripts/audit-api-endpoints.mjs

      - name: Audit deploy config
        run: node scripts/audit-deploy-config.mjs

      - name: Audit APK release (API, cleartext, assets)
        run: node scripts/audit-apk-release.mjs

      - name: Verify production API config
        run: node scripts/verify-production-api.mjs

      - name: Preflight Google Maps Android API key
        run: |
          if [ -z "${GOOGLE_MAPS_ANDROID_API_KEY}" ]; then
            echo "GOOGLE_MAPS_ANDROID_API_KEY is missing."
            echo "Add repository secret GOOGLE_MAPS_ANDROID_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "GOOGLE_MAPS_ANDROID_API_KEY is set (value not logged)."

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Apply Android release config
        run: node scripts/ensure-android-release-config.mjs

      - name: Print signing certificate fingerprints (safe)
        run: node scripts/print-signing-cert-fingerprints.mjs

      - name: Verify Google Maps Android manifest config
        run: node scripts/verify-android-maps-config.mjs

      - name: Verify Google Maps release configuration
        run: node scripts/verify-google-maps-release.mjs

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_BASE_URL: http://13.207.17.117/api/v1/
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_ALLOW_INSECURE_HTTP: "1"
          GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
        run: ./gradlew assembleRelease --build-cache --no-daemon --stacktrace

      - name: Rename APK for client delivery
        run: cp android/app/build/outputs/apk/release/app-release.apk Kavya_Agri_Clinic_Client_QA_v1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kavya_Agri_Clinic_Client_QA_v1.0.1
          path: Kavya_Agri_Clinic_Client_QA_v1.0.1.apk
          if-no-files-found: error
          retention-days: 30
